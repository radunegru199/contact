<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silviu Udriță - True GSM</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      padding: 60px 25px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 20px;
      font-weight: normal;
      color: #bbb;
      margin-top: 0;
    }

    .phone {
      font-size: 22px;
      margin: 35px 0;
    }

    .button {
      width: 100%;
      background: white;
      color: black;
      border: 0;
      font-size: 20px;
      font-weight: bold;
      padding: 20px;
      border-radius: 15px;
      margin-top: 30px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Silviu Udriță</h1>
  <h2>TRUE GSM</h2>

  <div class="phone">
    +40 761 416 650
  </div>

  <button class="button" onclick="saveContact()">
    SALVEAZĂ CONTACTUL
  </button>

</div>

<script>
function saveContact() {

  const isiPhone =
    /iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isiPhone) {
    window.location.href = "Silviu-Udrita.vcf";
    return;
  }

  const vcard =
`BEGIN:VCARD
VERSION:3.0
N:Udriță;Silviu;;;
FN:Silviu Udriță
ORG:True GSM
TEL;TYPE=CELL:+40761416650
END:VCARD`;

  const blob = new Blob(
    [vcard],
    { type: "text/vcard;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "Silviu-Udrita-" + Date.now() + ".vcf";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 1000);
}
</script>

</body>
</html>
