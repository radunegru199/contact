<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Silviu Udriță - True GSM</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      padding: 60px 25px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 20px;
      font-weight: normal;
      color: #bbb;
    }

    .phone {
      font-size: 22px;
      margin: 35px 0;
    }

    .button {
      display: block;
      background: white;
      color: black;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      padding: 20px;
      border-radius: 15px;
      margin-top: 30px;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const isiPhone =
        /iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isiPhone) {
        window.location.replace("Silviu-Udrita.vcf");
      }

    });
  </script>

</head>

<body>

  <div class="card">

    <h1>Silviu Udriță</h1>
    <h2>TRUE GSM</h2>

    <div class="phone">
      +40 761 416 650
    </div>

    <a class="button" href="Silviu-Udrita.vcf">
      SALVEAZĂ CONTACTUL
    </a>

  </div>

</body>
</html>
